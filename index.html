<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scanner BLE</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --card2: #232634;
      --accent: #3b82f6;
      --green: #22c55e;
      --text: #e8eaf0;
      --muted: #8a90a0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      min-height: 100vh;
    }
    h1 { font-size: 22px; margin-bottom: 4px; }
    .sottotitolo { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    #scanBtn {
      width: 100%; padding: 16px; font-size: 17px; font-weight: 600;
      color: white; background: var(--accent); border: none;
      border-radius: 14px; cursor: pointer;
    }
    #scanBtn:active { opacity: 0.7; }
    #stato {
      text-align: center; color: var(--muted); font-size: 13px;
      margin: 16px 0; min-height: 18px;
    }
    .categoria {
      font-size: 13px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.5px; margin: 22px 0 10px;
    }
    .device { background: var(--card); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
    .device-top { display: flex; align-items: center; gap: 12px; }
    .device .icona { font-size: 26px; }
    .device .info { flex: 1; min-width: 0; }
    .device .nome {
      font-size: 16px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .device .id {
      font-size: 11px; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .connetti {
      padding: 8px 14px; font-size: 14px; font-weight: 600;
      color: var(--accent); background: transparent;
      border: 1.5px solid var(--accent); border-radius: 10px;
      cursor: pointer; white-space: nowrap;
    }
    .connetti:active { background: rgba(59,130,246,0.15); }
    .connetti.connesso { color: var(--green); border-color: var(--green); }
    .dettagli {
      margin-top: 12px; padding-top: 12px;
      border-top: 1px solid var(--card2); font-size: 14px; display: none;
    }
    .dettagli.aperto { display: block; }
    .riga { display: flex; justify-content: space-between; padding: 5px 0; }
    .riga .etichetta { color: var(--muted); }
    .riga .valore { font-weight: 600; }
    .capacita { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { font-size: 12px; background: var(--card2); padding: 4px 10px; border-radius: 8px; }
    .vuoto {
      text-align: center; color: var(--muted); font-size: 14px;
      margin-top: 40px; line-height: 1.5;
    }
  </style>
</head>
<body>

  <h1>📡 Scanner BLE</h1>
  <div class="sottotitolo">Trova i dispositivi Bluetooth e leggi cosa sanno fare</div>

  <button id="scanBtn">Scansiona</button>
  <div id="stato"></div>
  <div id="lista">
    <div class="vuoto">Premi "Scansiona" per cercare<br>i dispositivi nelle vicinanze.</div>
  </div>

  <script>
    const scanBtn = document.getElementById("scanBtn");
    const stato   = document.getElementById("stato");
    const lista   = document.getElementById("lista");

    const trovati = {};

    // Controllo all'avvio: il Bluetooth e' disponibile?
    window.addEventListener("load", function() {
      if (navigator.bluetooth) {
        stato.textContent = "Bluetooth disponibile. Pronto per la scansione.";
      } else {
        stato.textContent = "Bluetooth NON disponibile in questo browser.";
      }
    });

    // Dizionario: codici servizi BLE standard -> nome leggibile (UUID Bluetooth SIG)
    const SERVIZI = {
      "00001800": { nome: "Accesso Generico",         cat: "Periferiche" },
      "00001801": { nome: "Attributi Generici",       cat: "Periferiche" },
      "0000180a": { nome: "Informazioni Dispositivo", cat: "Periferiche" },
      "0000180f": { nome: "Batteria",                 cat: "Dispositivi con batteria" },
      "0000180d": { nome: "Frequenza Cardiaca",       cat: "Fitness e salute" },
      "00001816": { nome: "Cadenza e Velocita",       cat: "Fitness e salute" },
      "00001814": { nome: "Velocita di Corsa",        cat: "Fitness e salute" },
      "0000181c": { nome: "Dati Utente",              cat: "Fitness e salute" },
      "00001812": { nome: "Tastiera / Mouse (HID)",   cat: "Periferiche" },
      "00001844": { nome: "Controllo Volume",         cat: "Audio" },
      "0000184e": { nome: "Audio Stream Control",     cat: "Audio" },
      "00001805": { nome: "Ora Corrente",             cat: "Periferiche" },
      "0000feaa": { nome: "Beacon Eddystone",         cat: "Altri dispositivi" }
    };

    function chiaveServizio(uuid) {
      return String(uuid).toLowerCase().slice(0, 8);
    }
    function nomeServizio(uuid) {
      const s = SERVIZI[chiaveServizio(uuid)];
      return s ? s.nome : "Servizio sconosciuto";
    }
    function iconaCategoria(cat) {
      if (cat === "Fitness e salute")         return "\u2764\uFE0F";
      if (cat === "Dispositivi con batteria") return "\uD83D\uDD0B";
      if (cat === "Audio")                    return "\uD83C\uDFA7";
      if (cat === "Periferiche")              return "\u2328\uFE0F";
      return "\uD83D\uDCF6";
    }

    scanBtn.addEventListener("click", async () => {
      if (!navigator.bluetooth) {
        stato.textContent = "Bluetooth non disponibile. Apri la pagina con il browser Bluefy.";
        return;
      }
      try {
        stato.textContent = "Apertura selettore dispositivi...";
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [
            "generic_access", "device_information", "battery_service",
            "heart_rate", 0x1812, 0x1844
          ]
        });
        trovati[device.id] = {
          device: device,
          nome: device.name || "Dispositivo senza nome",
          categoria: "Altri dispositivi",
          dettagli: null
        };
        stato.textContent = "Dispositivo aggiunto. Premi Connetti per leggerne i dati.";
        disegnaLista();
      } catch (err) {
        if (err && err.name === "NotFoundError") {
          stato.textContent = "Nessun dispositivo selezionato.";
        } else {
          var nome = (err && err.name) ? err.name : "Sconosciuto";
          var msg  = (err && err.message) ? err.message : String(err);
          stato.textContent = "ERRORE [" + nome + "] " + msg;
        }
      }
    });

    async function connetti(id, btn) {
      const d = trovati[id];
      if (!d) return;
      try {
        btn.textContent = "Connessione...";
        const server = await d.device.gatt.connect();
        stato.textContent = 'Connesso a "' + d.nome + '". Lettura dati...';

        const dett = { batteria: null, produttore: null, modello: null, capacita: [] };

        let servizi = [];
        try { servizi = await server.getPrimaryServices(); } catch (e) { servizi = []; }

        for (const s of servizi) {
          const nome = nomeServizio(s.uuid);
          if (!dett.capacita.includes(nome)) dett.capacita.push(nome);
        }
        if (dett.capacita.length === 0) dett.capacita.push("Nessun servizio leggibile");

        try {
          const sBatt = await server.getPrimaryService("battery_service");
          const cBatt = await sBatt.getCharacteristic("battery_level");
          const valore = await cBatt.readValue();
          dett.batteria = valore.getUint8(0);
        } catch (e) { dett.batteria = null; }

        try {
          const sInfo = await server.getPrimaryService("device_information");
          try {
            const c = await sInfo.getCharacteristic("manufacturer_name_string");
            const v = await c.readValue();
            dett.produttore = new TextDecoder().decode(v);
          } catch (e) {}
          try {
            const c = await sInfo.getCharacteristic("model_number_string");
            const v = await c.readValue();
            dett.modello = new TextDecoder().decode(v);
          } catch (e) {}
        } catch (e) {}

        d.dettagli = dett;
        stato.textContent = '"' + d.nome + '" - dati letti.';
        disegnaLista(id);
      } catch (err) {
        stato.textContent = "Connessione fallita: " + err.message;
        disegnaLista();
      }
    }

    function disegnaLista(apriId) {
      const chiavi = Object.keys(trovati);
      if (chiavi.length === 0) {
        lista.innerHTML = '<div class="vuoto">Premi "Scansiona" per cercare<br>i dispositivi nelle vicinanze.</div>';
        return;
      }
      const gruppi = {};
      for (const k of chiavi) {
        const d = trovati[k];
        if (!gruppi[d.categoria]) gruppi[d.categoria] = [];
        gruppi[d.categoria].push({ id: k, ...d });
      }
      let html = "";
      for (const cat of Object.keys(gruppi)) {
        html += '<div class="categoria">' + cat + '</div>';
        for (const d of gruppi[cat]) {
          const connesso = d.dettagli !== null;
          let dettHtml = "";
          if (connesso) {
            const x = d.dettagli;
            let righe = "";
            if (x.batteria !== null)
              righe += '<div class="riga"><span class="etichetta">Batteria</span><span class="valore">' + x.batteria + '%</span></div>';
            else
              righe += '<div class="riga"><span class="etichetta">Batteria</span><span class="valore">non disponibile</span></div>';
            if (x.produttore)
              righe += '<div class="riga"><span class="etichetta">Produttore</span><span class="valore">' + x.produttore + '</span></div>';
            if (x.modello)
              righe += '<div class="riga"><span class="etichetta">Modello</span><span class="valore">' + x.modello + '</span></div>';
            const tags = x.capacita.map(function(c){ return '<span class="tag">' + c + '</span>'; }).join("");
            dettHtml =
              '<div class="dettagli ' + (apriId === d.id ? "aperto" : "") + '">' +
                righe +
                '<div class="riga"><span class="etichetta">Cosa sa fare:</span></div>' +
                '<div class="capacita">' + tags + '</div>' +
              '</div>';
          }
          html +=
            '<div class="device">' +
              '<div class="device-top">' +
                '<div class="icona">' + iconaCategoria(cat) + '</div>' +
                '<div class="info">' +
                  '<div class="nome">' + d.nome + '</div>' +
                  '<div class="id">' + d.id + '</div>' +
                '</div>' +
                '<button class="connetti ' + (connesso ? "connesso" : "") + '" data-id="' + d.id + '">' +
                  (connesso ? "Connesso" : "Connetti") +
                '</button>' +
              '</div>' +
              dettHtml +
            '</div>';
        }
      }
      lista.innerHTML = html;
      document.querySelectorAll(".connetti").forEach(function(btn){
        btn.addEventListener("click", function(){ connetti(btn.dataset.id, btn); });
      });
    }
  </script>

</body>
</html>
